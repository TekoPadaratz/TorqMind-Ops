services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-torqmind_ops}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-torqmind_ops}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-torqmind_ops}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      STORAGE_LOCAL_ROOT: /app/storage
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      GDRIVE_ROOT_FOLDER_ID: ${GDRIVE_ROOT_FOLDER_ID:-1Ab-fynAW0c7Cpx-zjXUIE2xvNCVpWEC9}
      GDRIVE_OAUTH_TOKEN_FILE: ${GDRIVE_OAUTH_TOKEN_FILE:-/app/secrets/gdrive-oauth-token.json}
      GDRIVE_CREDENTIALS_FILE: ${GDRIVE_CREDENTIALS_FILE:-}
      GDRIVE_CREDENTIALS_JSON: ${GDRIVE_CREDENTIALS_JSON:-}
      TZ: America/Sao_Paulo
      VOICE_ENABLED: ${VOICE_ENABLED:-true}
      VOICE_TRANSCRIPTION_PROVIDER: ${VOICE_TRANSCRIPTION_PROVIDER:-deterministic}
      VOICE_INTENT_PROVIDER: ${VOICE_INTENT_PROVIDER:-deterministic}
      VOICE_OPENAI_API_KEY: ${VOICE_OPENAI_API_KEY:-}
      VOICE_OPENAI_BASE_URL: ${VOICE_OPENAI_BASE_URL:-https://api.openai.com/v1}
      VOICE_TRANSCRIBE_MODEL: ${VOICE_TRANSCRIBE_MODEL:-whisper-1}
      VOICE_INTENT_MODEL: ${VOICE_INTENT_MODEL:-gpt-4o-mini}
    volumes:
      - storage:/app/storage
      - ./secrets:/app/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  frontend:
    build: ./frontend
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "88:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
  storage:
