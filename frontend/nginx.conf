server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Assets com hash no nome: cache longo e imutável
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Service worker nunca em cache (garante limpeza/atualização)
  location = /sw.js {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }
  location = /registerSW.js {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  # App shell / navegação: sempre fresco
  location / {
    add_header Cache-Control "no-store";
    try_files $uri $uri/ /index.html;
  }
}
