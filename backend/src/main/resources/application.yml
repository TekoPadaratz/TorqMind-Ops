spring:
  application:
    name: torqmind-ops-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/torqmind_ops}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 20MB

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production}
    issuer: torqmind-ops
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:720}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  bootstrap-admin:
    username: ${BOOTSTRAP_ADMIN_USERNAME:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    full-name: ${BOOTSTRAP_ADMIN_FULL_NAME:Administrador}
  storage:
    provider: ${STORAGE_PROVIDER:local}
    local-root: ${STORAGE_LOCAL_ROOT:/app/storage}
    gdrive:
      root-folder-id: ${GDRIVE_ROOT_FOLDER_ID:1Ab-fynAW0c7Cpx-zjXUIE2xvNCVpWEC9}
      oauth-token-file: ${GDRIVE_OAUTH_TOKEN_FILE:}
      credentials-file: ${GDRIVE_CREDENTIALS_FILE:}
      credentials-json: ${GDRIVE_CREDENTIALS_JSON:}
  voice:
    enabled: ${VOICE_ENABLED:true}
    transcription-provider: ${VOICE_TRANSCRIPTION_PROVIDER:deterministic}
    intent-provider: ${VOICE_INTENT_PROVIDER:deterministic}
    openai-api-key: ${VOICE_OPENAI_API_KEY:}
    openai-base-url: ${VOICE_OPENAI_BASE_URL:https://api.openai.com/v1}
    transcribe-model: ${VOICE_TRANSCRIBE_MODEL:whisper-1}
    intent-model: ${VOICE_INTENT_MODEL:gpt-4o-mini}
    max-audio-bytes: ${VOICE_MAX_AUDIO_BYTES:8388608}
    max-audio-seconds: ${VOICE_MAX_AUDIO_SECONDS:60}
    draft-ttl-minutes: ${VOICE_DRAFT_TTL_MINUTES:15}
    rate-limit-per-window: ${VOICE_RATE_LIMIT:20}
    rate-limit-window-seconds: ${VOICE_RATE_WINDOW_SECONDS:600}
    transcribe-timeout-ms: ${VOICE_TRANSCRIBE_TIMEOUT_MS:45000}
    intent-timeout-ms: ${VOICE_INTENT_TIMEOUT_MS:20000}

logging:
  level:
    root: INFO
    com.torqmind.ops: INFO
